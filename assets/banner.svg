<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0c16"/><stop offset="50%" stop-color="#121829"/><stop offset="100%" stop-color="#1a0f2e"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".2"/></linearGradient><linearGradient id="purple-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7f00ff" stop-opacity=".8"/><stop offset="100%" stop-color="#e100ff" stop-opacity=".2"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow-light" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-heavy" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="25"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="12"/></filter></defs><style>@keyframes pulse-orb-1{0%{transform:translate(0,0) scale(1);opacity:.4}50%{transform:translate(30px,-20px) scale(1.15);opacity:.7}}@keyframes pulse-orb-2{0%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(-25px,25px) scale(1.2);opacity:.6}}@keyframes wave-flow-1{0%{transform:translateX(0)}50%{transform:translateX(-60px)}}@keyframes wave-flow-2{0%{transform:translateX(0)}50%{transform:translateX(60px)}}@keyframes live-ping{0%{r:6px;opacity:.9}}@keyframes float-card{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.orb-1,.orb-2{animation:pulse-orb-1 8s ease-in-out infinite;transform-origin:center}.orb-2{animation:pulse-orb-2 10s ease-in-out infinite}.wave-1{animation:wave-flow-1 12s ease-in-out infinite}.wave-2{animation:wave-flow-2 15s ease-in-out infinite}.ping{animation:live-ping 2s cubic-bezier(0,0,.2,1) infinite}.stream-line{stroke-dasharray:8 8;animation:signal-dash 2s linear infinite}.floating-card-1{animation:float-card 6s ease-in-out infinite}.floating-card-2{animation:float-card 7s ease-in-out infinite 1s}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g id="dynamic-background-lights"><circle cx="200" cy="100" r="180" fill="url(#cyan-glow)" class="orb-1" filter="url(#glow-heavy)"/><circle cx="1000" cy="260" r="220" fill="url(#purple-glow)" class="orb-2" filter="url(#glow-heavy)"/><g class="wave-1" opacity=".25"><path fill="none" stroke="#00f2fe" stroke-width="3" d="M-100 280 Q 200 180, 500 290 T 1100 220 T 1300 300" filter="url(#glow-light)"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M-100 300 Q 250 200, 600 310 T 1150 240 T 1350 320"/></g><g class="wave-2" opacity=".2"><path fill="none" stroke="#9333ea" stroke-width="3" d="M-100 80 Q 300 200, 700 90 T 1250 140" filter="url(#glow-light)"/><path fill="none" stroke="#c084fc" stroke-width="1.5" d="M-100 100 Q 350 220, 750 110 T 1300 160"/></g><g class="floating-card-1" opacity=".4" transform="translate(60, 40)"><rect width="180" height="70" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="10"/><text x="15" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">RTMP / WebRTC Ingest</text><text x="15" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Latency: &lt; 500ms</text><path stroke="#38bdf8" stroke-width="2" d="M 180 35 L 260 35" class="stream-line"/></g><g class="floating-card-2" opacity=".4" transform="translate(960, 240)"><rect width="180" height="70" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="10"/><text x="15" y="30" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HLS / DASH Origin</text><text x="15" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Storage: S3 / MinIO</text><path stroke="#a855f7" stroke-width="2" d="M -80 35 L 0 35" class="stream-line"/></g></g><g id="foreground-content" filter="url(#shadow)"><rect width="840" height="270" x="180" y="45" fill="rgba(10, 15, 30, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="20"/><g transform="translate(540, 75)"><rect width="120" height="28" x="0" y="0" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1" rx="14"/><circle cx="20" cy="14" r="6" fill="#ef4444" class="ping"/><circle cx="20" cy="14" r="4" fill="#ef4444"/><text x="36" y="18" fill="#fca5a5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ECOSYSTEM</text></g><text x="600" y="145" fill="url(#title-grad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-.5" text-anchor="middle">Awesome Media Storage &amp; Live Streaming</text><text x="600" y="182" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Curated Directory for WebRTC, Cloud Origins, Low-Latency Servers &amp; Transcoding</text><g><g transform="translate(315, 220) translate(0, 0)"><rect width="170" height="34" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="17"/><text x="85" y="21" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Ultra Low-Latency</text></g><g transform="translate(315, 220) translate(185, 0)"><rect width="190" height="34" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" rx="17"/><text x="95" y="21" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🗄️ S3 &amp; Distributed Origin</text></g><g transform="translate(315, 220) translate(390, 0)"><rect width="180" height="34" fill="rgba(52, 211, 153, 0.1)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" rx="17"/><text x="90" y="21" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎬 HLS / DASH / FFmpeg</text></g></g></g></svg>