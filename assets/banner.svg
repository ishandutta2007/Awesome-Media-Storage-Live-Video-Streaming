<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Top Bar Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }

    /* Dynamic Animations placed safely in background & sides */
    @keyframes pulseCircle {
      0% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
      100% { transform: scale(1); opacity: 0.25; }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25px); }
      100% { transform: translateX(0); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-12px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }

    .pulsing-bg-1 {
      transform-origin: 1050px 80px;
      animation: pulseCircle 6s ease-in-out infinite;
    }
    .pulsing-bg-2 {
      transform-origin: 150px 260px;
      animation: pulseCircle 6s ease-in-out infinite 3s;
    }
    .wave-bg {
      animation: waveMove 7s ease-in-out infinite;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .p2 { animation-delay: 1.5s; }
    .p3 { animation-delay: 3s; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)" />

  <!-- Background Animated Decorative Elements (Behind Content) -->
  <g class="pulsing-bg-1">
    <circle cx="1050" cy="80" r="140" fill="#6366f1" />
  </g>
  <g class="pulsing-bg-2">
    <circle cx="150" cy="260" r="100" fill="#0284c7" />
  </g>

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" />
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320" />
  </g>

  <!-- Animated Wave Lines (Right Background Side) -->
  <g class="wave-bg" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="3" fill="none">
    <path d="M 850 220 Q 900 140 950 220 T 1050 220 T 1150 220" />
    <path d="M 830 240 Q 880 180 930 240 T 1030 240 T 1130 240" stroke="#818cf8" />
  </g>

  <!-- Dynamic Floating Particles -->
  <circle class="particle" cx="180" cy="70" r="4" fill="#38bdf8" />
  <circle class="particle p2" cx="980" cy="110" r="6" fill="#c084fc" />
  <circle class="particle p3" cx="1100" cy="240" r="5" fill="#818cf8" />

  <!-- Foreground Glass Content Frame -->
  <rect x="50" y="45" width="1100" height="230" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Foreground Content (Text & Badges) -->
  <g transform="translate(90, 105)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="245" height="28" rx="14" fill="#0369a1" fill-opacity="0.5" stroke="#0284c7" stroke-width="1" />
    <text x="14" y="18" class="badge-text">⚡ MEDIA STORAGE &amp; STREAMING</text>

    <!-- Main Title -->
    <text x="0" y="70" class="title">Awesome Media Storage &amp; Live Video Streaming</text>

    <!-- Subtitle -->
    <text x="0" y="108" class="subtitle">A curated directory of enterprise SaaS platforms &amp; open-source streaming engines</text>
  </g>
</svg>
